[project]
name = "repopilot-backend"
version = "0.1.0"
description = "RepoPilot API service"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ migrations directory would otherwise make the package look first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "postgres: needs a disposable PostgreSQL database in TEST_DATABASE_URL (skipped otherwise)",
]
